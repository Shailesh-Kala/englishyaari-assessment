services:
  mongo:
    image: mongo:8.2
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    # Initiates the single-node replica set on first start; reports healthy once it is primary.
    healthcheck:
      test: >-
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
